<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="agroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00351a" />
      <stop offset="100%" stop-color="#0e4d2b" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="#eff8f2" />

  <!-- Circular Badge Glow -->
  <circle cx="200" cy="195" r="140" fill="url(#agroGrad)" opacity="0.14" filter="url(#glowGreen)" />
  <circle cx="200" cy="195" r="115" fill="#d1fae5" />

  <!-- Agronomist / Stethoscope / Plant Inspection Art -->
  <!-- Clipboard Body -->
  <rect x="135" y="115" width="130" height="155" rx="14" fill="#ffffff" stroke="#00351a" stroke-width="4" />
  <!-- Clipboard Metal Clip -->
  <rect x="170" y="102" width="60" height="22" rx="6" fill="#00351a" />
  <circle cx="200" cy="112" r="4" fill="#a3f69c" />

  <!-- Checklist lines on clipboard -->
  <rect x="175" y="145" width="70" height="7" rx="3.5" fill="#e2e8f0" />
  <circle cx="155" cy="148" r="6" fill="#10b981" />
  
  <rect x="175" y="168" width="70" height="7" rx="3.5" fill="#e2e8f0" />
  <circle cx="155" cy="171" r="6" fill="#10b981" />

  <rect x="175" y="191" width="70" height="7" rx="3.5" fill="#e2e8f0" />
  <circle cx="155" cy="194" r="6" fill="#10b981" />

  <!-- Plant inspection badge overlapping clipboard -->
  <circle cx="240" cy="225" r="45" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4" />
  
  <!-- Sprout / Leaf in badge -->
  <path d="M 240 248 C 240 220 258 205 258 205 C 258 205 240 215 230 228 C 224 220 216 218 216 218 C 216 218 228 232 236 248 Z" fill="#a3f69c" />
  <circle cx="240" cy="248" r="3" fill="#ffffff" />

  <!-- Stethoscope / Headset communication symbol -->
  <path d="M 130 180 C 115 180 105 195 105 210 C 105 235 125 255 155 255 L 165 255" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none" />
  <circle cx="130" cy="180" r="8" fill="#0284c7" />
  <circle cx="165" cy="255" r="7" fill="#0284c7" />

  <!-- Badge Text Banner -->
  <rect x="65" y="325" width="270" height="42" rx="21" fill="#00351a" />
  <text x="200" y="352" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    استشارات ومهندس زراعي ميداني
  </text>
</svg>
