<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="irrigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="#eff8f2" />

  <!-- Circular Badge Glow -->
  <circle cx="200" cy="200" r="140" fill="url(#irrigGrad)" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="200" r="115" fill="#e0f2fe" />

  <!-- Agricultural Irrigation Pipes & Droplets -->
  <!-- Main central pipe -->
  <path d="M 60 250 Q 200 230 340 250" stroke="url(#pipeGrad)" stroke-width="14" stroke-linecap="round" fill="none" />
  
  <!-- Sub-pipes (Drip lines) -->
  <path d="M 120 240 Q 120 180 140 130" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="8 4" />
  <path d="M 200 235 L 200 110" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="8 4" />
  <path d="M 280 240 Q 280 180 260 130" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="8 4" />

  <!-- Emitter Nozzles -->
  <circle cx="140" cy="130" r="7" fill="#0284c7" />
  <circle cx="200" cy="110" r="8" fill="#0284c7" />
  <circle cx="260" cy="130" r="7" fill="#0284c7" />

  <!-- Large Central Water Droplet with Sprout -->
  <path d="M 200 90 C 160 150 140 185 140 220 A 60 60 0 1 0 260 220 C 260 185 240 150 200 90 Z" fill="url(#irrigGrad)" />
  
  <!-- Droplet shine -->
  <ellipse cx="178" cy="195" rx="14" ry="24" transform="rotate(-25 178 195)" fill="#ffffff" opacity="0.5" />

  <!-- Sprout inside droplet -->
  <path d="M 200 230 Q 200 175 220 165 C 225 185 215 210 200 230 Z" fill="#ffffff" />
  <path d="M 200 215 Q 185 180 175 190 C 175 205 190 220 200 225 Z" fill="#a3f69c" />

  <!-- Spray Arcs -->
  <path d="M 170 120 A 40 40 0 0 1 230 120" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 155 100 A 60 60 0 0 1 245 100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6" fill="none" opacity="0.6" />

  <!-- Soil / Crop bed at bottom -->
  <path d="M 80 290 Q 200 280 320 290" stroke="#166534" stroke-width="10" stroke-linecap="round" fill="none" />
  <circle cx="110" cy="288" r="5" fill="#22c55e" />
  <circle cx="160" cy="285" r="6" fill="#22c55e" />
  <circle cx="200" cy="284" r="7" fill="#15803d" />
  <circle cx="240" cy="285" r="6" fill="#22c55e" />
  <circle cx="290" cy="288" r="5" fill="#22c55e" />

  <!-- Badge Text Banner -->
  <rect x="80" y="325" width="240" height="42" rx="21" fill="#00351a" />
  <text x="200" y="352" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    شبكات وأنظمة ري حديثة
  </text>
</svg>
