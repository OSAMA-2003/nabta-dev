<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="#eff8f2" />

  <!-- Circular Badge Glow -->
  <circle cx="200" cy="195" r="140" fill="url(#eqGrad)" opacity="0.12" filter="url(#glowGold)" />
  <circle cx="200" cy="195" r="115" fill="#fef3c7" />

  <!-- Heavy Agricultural Tractor / Equipment Silhouette Artwork -->
  <!-- Exhaust Stack -->
  <path d="M 245 105 L 245 145" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
  <path d="M 248 105 L 253 100" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />

  <!-- Tractor Cabin Roof & Glass -->
  <path d="M 175 125 L 235 125 L 225 180 L 165 180 Z" fill="#ffffff" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" />
  <path d="M 185 133 L 225 133 L 218 172 L 178 172 Z" fill="#bae6fd" opacity="0.85" />

  <!-- Engine Hood / Body -->
  <path d="M 235 155 L 285 160 L 290 205 L 225 205 Z" fill="url(#eqGrad)" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" />
  <!-- Engine Grille Slits -->
  <line x1="265" y1="172" x2="280" y2="173" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="265" y1="182" x2="280" y2="183" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="265" y1="192" x2="280" y2="193" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Headlight -->
  <circle cx="286" cy="168" r="6" fill="#fef08a" stroke="#1e293b" stroke-width="2" />

  <!-- Tractor Body Frame -->
  <rect x="155" y="180" width="75" height="28" rx="4" fill="url(#eqGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Huge Rear Wheel -->
  <circle cx="160" cy="225" r="48" fill="url(#darkMetal)" />
  <circle cx="160" cy="225" r="32" fill="#f59e0b" stroke="#1e293b" stroke-width="4" />
  <circle cx="160" cy="225" r="14" fill="#334155" />
  <!-- Tire treads -->
  <circle cx="160" cy="225" r="44" stroke="#ffffff" stroke-width="3" stroke-dasharray="7 14" fill="none" opacity="0.3" />

  <!-- Front Wheel -->
  <circle cx="270" cy="235" r="30" fill="url(#darkMetal)" />
  <circle cx="270" cy="235" r="18" fill="#f59e0b" stroke="#1e293b" stroke-width="3" />
  <circle cx="270" cy="235" r="8" fill="#334155" />
  <!-- Front treads -->
  <circle cx="270" cy="235" r="27" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5 10" fill="none" opacity="0.3" />

  <!-- Ground Plane -->
  <path d="M 75 270 L 325 270" stroke="#78350f" stroke-width="7" stroke-linecap="round" />
  <circle cx="100" cy="270" r="4" fill="#a16207" />
  <circle cx="210" cy="270" r="3" fill="#a16207" />
  <circle cx="310" cy="270" r="4" fill="#a16207" />

  <!-- Badge Text Banner -->
  <rect x="75" y="325" width="250" height="42" rx="21" fill="#00351a" />
  <text x="200" y="352" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    تأجير معدات ثقيلة للمزارع
  </text>
</svg>
